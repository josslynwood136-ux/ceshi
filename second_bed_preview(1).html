<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>次卧新床预览</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5e9e2}
  body{font-family:"Microsoft YaHei",system-ui,sans-serif}
  #wrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  .hint{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    padding:9px 14px;border-radius:999px;
    background:rgba(255,250,247,.88);color:#765f55;
    font-size:12px;box-shadow:0 5px 22px rgba(85,55,45,.12);
    backdrop-filter:blur(10px);pointer-events:none
  }
  .title{
    position:fixed;left:22px;top:20px;
    padding:10px 14px;border-radius:14px;
    background:rgba(255,250,247,.88);color:#604c43;
    box-shadow:0 5px 22px rgba(85,55,45,.1);
    backdrop-filter:blur(10px)
  }
  .title b{display:block;font-size:14px}.title span{font-size:11px;color:#a58e83}
</style>
</head>
<body>
<div id="wrap"></div>
<div class="title"><b>次卧 · 新床方案 A</b><span>奶油木质 + 柔软布艺</span></div>
<div class="hint">左键拖动旋转 · 滚轮缩放 · 右键平移</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  const THREE = window.THREE;
  const root = document.getElementById('wrap');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf6e9e1);
  scene.fog = new THREE.Fog(0xf6e9e1, 15, 32);

  const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, .1, 100);
  camera.position.set(7.8,5.6,8.2);
  camera.lookAt(0,1.3,0);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;
  root.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;
  controls.dampingFactor=.06;
  controls.target.set(0,1.25,0);
  controls.minDistance=5;
  controls.maxDistance=15;
  controls.maxPolarAngle=Math.PI*.48;

  const hemi = new THREE.HemisphereLight(0xfff6f0,0xc9a99a,1.8);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(0xffead7,2.4);
  key.position.set(5,9,6);
  key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.left=-7; key.shadow.camera.right=7;
  key.shadow.camera.top=7; key.shadow.camera.bottom=-7;
  scene.add(key);
  const fill = new THREE.PointLight(0xffd9c5,1.0,12);
  fill.position.set(-4,3,2);
  scene.add(fill);

  const mats = {
    wood:new THREE.MeshStandardMaterial({color:0xc89f7b,roughness:.62}),
    woodDark:new THREE.MeshStandardMaterial({color:0xa77d5d,roughness:.66}),
    cream:new THREE.MeshStandardMaterial({color:0xfff8f1,roughness:.95}),
    fabric:new THREE.MeshStandardMaterial({color:0xe8d6c9,roughness:1}),
    fabric2:new THREE.MeshStandardMaterial({color:0xd8c0b0,roughness:1}),
    pink:new THREE.MeshStandardMaterial({color:0xe7bfc1,roughness:.95}),
    sage:new THREE.MeshStandardMaterial({color:0xb9c5aa,roughness:.95}),
    metal:new THREE.MeshStandardMaterial({color:0xb98e70,roughness:.38,metalness:.35})
  };

  function box(w,h,d,mat,r=0){
    const g=new THREE.BoxGeometry(w,h,d,4,2,4);
    const m=new THREE.Mesh(g,mat);
    m.castShadow=true;m.receiveShadow=true;
    if(r) m.geometry.translate(0,0,0);
    return m;
  }
  function cyl(rt,rb,h,mat){
    const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,20),mat);
    m.castShadow=true;m.receiveShadow=true;return m;
  }

  // Floor / soft backdrop
  const floor=box(18,.18,18,new THREE.MeshStandardMaterial({color:0xd9b69b,roughness:1}));
  floor.position.y=-.1; scene.add(floor);

  // Rug
  const rugMat=new THREE.MeshStandardMaterial({color:0xf7eee7,roughness:1});
  const rug=new THREE.Mesh(new THREE.CylinderGeometry(3.7,3.7,.06,64),rugMat);
  rug.scale.z=.64; rug.position.set(0,.015,.55); rug.receiveShadow=true; scene.add(rug);

  const bed=new THREE.Group();

  // Low warm wooden platform
  const platform=box(4.25,.42,5.45,mats.wood,.08);
  platform.position.y=.28; bed.add(platform);

  // Rounded-looking side rails
  const railL=box(.16,.48,5.15,mats.woodDark);
  railL.position.set(-2.03,.52,0); bed.add(railL);
  const railR=railL.clone(); railR.position.x=2.03; bed.add(railR);

  // Feet
  [[-1.86,-2.25],[1.86,-2.25],[-1.86,2.25],[1.86,2.25]].forEach(p=>{
    const foot=cyl(.09,.12,.36,mats.metal);
    foot.position.set(p[0],.02,p[1]); bed.add(foot);
  });

  // Thick soft mattress
  const mattress=box(4.02,.48,5.18,mats.cream);
  mattress.position.y=.72; bed.add(mattress);

  // Mattress topper
  const topper=box(3.94,.18,5.08,new THREE.MeshStandardMaterial({color:0xfffaf6,roughness:1}));
  topper.position.y=1.01; bed.add(topper);

  // Headboard: upholstered panel + slim wood outline
  const head=box(4.28,2.35,.28,mats.fabric);
  head.position.set(0,2.03,-2.58); bed.add(head);

  const headTop=box(4.5,.12,.38,mats.wood);
  headTop.position.set(0,3.18,-2.58); bed.add(headTop);
  const headLeft=box(.12,2.25,.38,mats.wood);
  headLeft.position.set(-2.18,2.02,-2.58); bed.add(headLeft);
  const headRight=headLeft.clone(); headRight.position.x=2.18; bed.add(headRight);

  // Soft vertical channels
  for(let x=-1.5;x<=1.5;x+=.5){
    const seam=new THREE.Mesh(
      new THREE.BoxGeometry(.035,2.0,.025),
      new THREE.MeshStandardMaterial({color:0xd3bbad,roughness:1})
    );
    seam.position.set(x,2.03,-2.42); bed.add(seam);
  }

  // Blanket folded at foot
  const throw=box(4.02,.22,1.55,mats.sage);
  throw.position.set(0,1.13,1.42); bed.add(throw);
  // pink accent strip
  const strip=box(4.04,.035,.16,mats.pink);
  strip.position.set(0,1.255,1.35); bed.add(strip);

  // Two large pillows + two accent pillows
  function pillow(x,z,w,d,mat,rot){
    const p=box(w,.28,d,mat);
    p.position.set(x,1.27,z); p.rotation.x=rot||0.08; bed.add(p); return p;
  }
  pillow(-1.02,-1.72,1.48,.92,mats.cream,.08);
  pillow(1.02,-1.72,1.48,.92,mats.cream,-.08);
  pillow(-.62,-1.20,.78,.58,mats.pink,.12);
  pillow(.62,-1.20,.78,.58,mats.sage,-.12);

  // Small knitted-looking throw folded on one side
  const sideThrow=box(1.0,.12,1.15,mats.fabric2);
  sideThrow.position.set(1.47,.99,.15); sideThrow.rotation.y=-.02; bed.add(sideThrow);

  bed.position.y=0;
  scene.add(bed);

  // Small bedside object just to show scale
  const stool=box(1.0,.55,1.0,mats.wood);
  stool.position.set(3.25,.275,-1.55); scene.add(stool);
  const lampBase=cyl(.18,.22,.08,mats.metal); lampBase.position.set(3.25,.59,-1.55); scene.add(lampBase);
  const lampStem=cyl(.035,.04,.38,mats.metal); lampStem.position.set(3.25,.81,-1.55); scene.add(lampStem);
  const shade=new THREE.Mesh(
    new THREE.CylinderGeometry(.18,.30,.30,24,1,true),
    new THREE.MeshStandardMaterial({color:0xffeee2,roughness:.9,side:THREE.DoubleSide})
  );
  shade.position.set(3.25,1.02,-1.55); scene.add(shade);
  const bulb=new THREE.Mesh(
    new THREE.SphereGeometry(.06,16,12),
    new THREE.MeshStandardMaterial({color:0xffe3a3,emissive:0xffd98a,emissiveIntensity:1.4})
  );
  bulb.position.set(3.25,.94,-1.55); scene.add(bulb);

  function resize(){
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  }
  addEventListener('resize',resize);

  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene,camera);
  }
  animate();
})();
</script>
</body>
</html>
